paths:
  tiles_manifest: data/interim/tiles/H_glaber_tiles_manifest.csv
  labelmap: annotations/labelmap.json

  output_dir: outputs
  run_name: null   # if null, autogenerated timestamp

data:
  # tiles_manifest must contain columns: tile_path, label
  # label values must match labelmap keys
  split:
    seed: 42
    train: 0.70
    val: 0.15
    test: 0.15

train:
  epochs: 10
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  image_size: 224
  backbone: resnet18
  device: auto   # auto|cpu|cuda|mps
