# ============================================================
# train.yaml — config for cnn_pipeline.py
# ============================================================
# All paths are relative to the repository root.
# Override the run_name to resume or label experiments;
# leave blank to auto-generate a timestamped name.
# ============================================================

paths:
  data_dir: data/processed/H_glaber       # folder with train/, valid/, test/ subfolders
  test_dir: data/processed/H_glaber/test   # test tiles 
  output_dir: outputs
  run_name: null                           # null = auto-generated timestamp

train:
  epochs_head: 5          # frozen fine-tune (head only)
  epochs_full: 10         # unfrozen full training
  batch_size: 16
  lr_head: 0.001          # learning rate for head phase
  lr_full_min: 0.00001    # discriminative LR range (unfrozen)
  lr_full_max: 0.001
  image_size: 224
  patience: 3             # early stopping patience
  device: auto            # auto | cpu | cuda | mps

wsi:
  wsi_dir: data/raw/H_glaber
  level: 1
  download_script: scripts/download_mother_nmr.sh
