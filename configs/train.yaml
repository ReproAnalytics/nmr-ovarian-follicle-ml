# ============================================================
# train.yaml — config for cnn_pipeline.py
# ============================================================
# All paths are relative to the repository root.
# Override the run_name to resume or label experiments;
# leave blank to auto-generate a timestamped name.
# ============================================================

paths:
  data_dir:    "CNN"                # contains train/ and valid/ subfolders
  test_dir:    "CNN/test"           # test tiles, same subfolder layout
  output_dir:  "outputs"
  run_name:    ""                   # blank → auto "run_YYYYMMDD_HHMMSS"


train:
  image_size:   224
  batch_size:   16
  epochs_head:  5          # frozen fine-tune (head only)
  epochs_full:  10         # unfrozen full training
  lr_head:      1.0e-3     # learning rate for phase 1
  lr_full_min:  1.0e-5     # discriminative LR range for phase 2
  lr_full_max:  1.0e-3
  patience:     3          # early-stopping patience (epochs)
  device:       "auto"     # auto | cuda | mps | cpu

wsi:
  wsi_dir:          "data/wsi"
  level:            1
  download_script:  "scripts/download_mother_nmr.sh"
