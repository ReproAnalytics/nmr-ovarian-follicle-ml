name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "👋 Thanks for opening your first issue! Please include a brief description. This helps us track capstone progress clearly."
        pr-message: "🎉 Thanks for your PR! Please include a short summary of changes and confirm your branch is up to date with `main`."
